# Render Blueprint — Hakuna Remediation Platform (Free Tier)
# Deploy: https://render.com/docs/blueprint-spec
#
# IMPORTANT — after first deploy, set these env vars in the Render dashboard:
#   1. hakuna-frontend → VITE_API_URL = https://hakuna-backend.onrender.com
#   2. hakuna-backend  → CORS_ORIGINS = https://hakuna-frontend.onrender.com
#   Then trigger a manual redeploy of the frontend.
#
# Free tier caveats:
#   - Services spin down after 15 min of inactivity (first request takes ~30s)
#   - SQLite data is ephemeral — lost on every deploy/restart
#   - 750 free hours/month shared across all services

services:
  # ── Backend (FastAPI) ──────────────────────────
  - type: web
    name: hakuna-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && cp ../intel.json . 2>/dev/null || true
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        value: sqlite:///./nessus_remediation.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # set to your frontend URL after first deploy
    autoDeploy: true
    healthCheckPath: /api/scans

  # ── Frontend (Static Site) ─────────────────────
  - type: web
    name: hakuna-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # set to backend URL, e.g. https://hakuna-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    autoDeploy: true
