# SOC 2 (2017 Trust Services Criteria) — initial mapping pack.
#
# Scope: Common Criteria (CC) and Availability/Confidentiality/Privacy
# series points that map cleanly to Hakuna's current detection surface.
# Trust-services controls that are wholly evidence-based (vendor risk,
# board oversight, communications) ship as testability=manual_only.

framework:
  slug: soc2_2017
  name: SOC 2
  version: "2017"
  authority: AICPA
  published_at: 2017-04-15
  description: |
    SOC 2 Trust Services Criteria (TSC 2017, with 2022 points of focus).
    Covers Security (Common Criteria), Availability, Processing Integrity,
    Confidentiality, and Privacy categories.
  categories: [Attestation]
  mapping_schema_version: 1

release:
  tag: "2026.04.25-v1"
  notes: |
    Initial SOC 2 mapping pack covering CC6.x (logical access),
    CC7.x (system operations / vuln mgmt), and the security-relevant
    points in A1, C1. Manual-only TSC criteria are included so they
    appear in the framework view as not_applicable.

controls:

  # ── CC6: Logical and Physical Access Controls ──────────────
  - ref: "CC6.1"
    title: Logical access security software, infrastructure, and architectures
    domain: Logical Access
    testability: automated
    canonical_guidance: |
      Logical access security software protects information assets. Public
      exposure of database/admin services on in-scope assets is direct
      evidence the access architecture is incomplete or misconfigured.
    mappings:
      - key: soc2_2017_cc6_1_easm_exposed_admin_db
        when:
          logic: AND
          conditions:
            - field: finding.plugin_family
              op: eq
              value: "EASM: Exposed Service"
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]

  - ref: "CC6.6"
    title: Logical access controls for systems open to outside the entity
    domain: Perimeter Security
    testability: automated
    canonical_guidance: |
      Boundaries of internal systems exposed to external users must enforce
      least privilege. EASM-discovered services and weak/cleartext crypto on
      perimeter assets indicate this criterion is not met.
    mappings:
      - key: soc2_2017_cc6_6_perimeter_weak_crypto
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-319", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "CC6.7"
    title: Restricts the transmission, movement, and removal of information
    domain: Data in Transit
    testability: automated
    canonical_guidance: |
      Information in transit must be protected. Findings tied to cleartext
      transmission (CWE-319) or broken/risky cryptography (CWE-326, CWE-327)
      fail this criterion.
    mappings:
      - key: soc2_2017_cc6_7_transit_crypto_weakness
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-319", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "CC6.8"
    title: Prevents or detects and acts upon the introduction of unauthorized software
    domain: Endpoint Integrity
    testability: partial
    canonical_guidance: |
      Hardcoded or weak credential exposure (CWE-798, CWE-1391) and any
      KEV-listed unresolved vulnerability indicate the software-introduction
      controls aren't catching what they should.
    mappings:
      - key: soc2_2017_cc6_8_hardcoded_or_weak_creds
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-798", "CWE-1391"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  # ── CC7: System Operations ─────────────────────────────────
  - ref: "CC7.1"
    title: Detects configuration changes and vulnerabilities
    domain: Vulnerability Management
    testability: automated
    canonical_guidance: |
      The entity uses detection and monitoring procedures to identify
      vulnerabilities. Any unresolved High+ severity finding with a CVE
      that has breached or is at risk of breaching SLA is evidence that
      the detect/respond loop is not closing.
    mappings:
      - key: soc2_2017_cc7_1_high_critical_breached_sla
        when:
          logic: AND
          conditions:
            - field: finding.has_cve
              op: is_true
            - field: finding.severity
              op: gte
              value: 3
            - field: finding.sla_status
              op: in
              value: [breached, at_risk]
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]

  - ref: "CC7.2"
    title: Monitors system components and operation for anomalies
    domain: Threat Detection
    testability: partial
    canonical_guidance: |
      Anomalies indicating malicious acts must be identified. Unresolved
      KEV-listed vulnerabilities are pre-anomaly evidence that the
      monitoring stack hasn't surfaced active attacker interest.
    mappings:
      - key: soc2_2017_cc7_2_unresolved_kev
        when:
          logic: AND
          conditions:
            - field: finding.is_kev
              op: is_true
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive, accepted_risk]

  - ref: "CC7.4"
    title: Responds to identified security incidents
    domain: Incident Response
    testability: manual_only
    canonical_guidance: |
      IR program effectiveness is evidence-based. Mark satisfied via a
      compensating-control note that links to the IR plan and tabletop
      records.
    mappings: []

  # ── CC8: Change Management ─────────────────────────────────
  - ref: "CC8.1"
    title: Authorizes, designs, develops, configures, documents, tests, approves, and implements changes
    domain: Change Management
    testability: manual_only
    canonical_guidance: |
      Change management process is evidence-based. Mark satisfied via a
      compensating-control note that links to the CAB records and ticket
      samples.
    mappings: []

  # ── A1: Availability ───────────────────────────────────────
  - ref: "A1.2"
    title: Authorized environmental protections, software, data backup, and recovery
    domain: Availability
    testability: manual_only
    canonical_guidance: |
      Backup/recovery validation is process-based. Mark satisfied via a
      compensating-control note that links to the most recent restore test.
    mappings: []

  # ── C1: Confidentiality ────────────────────────────────────
  - ref: "C1.1"
    title: Identifies and maintains confidential information
    domain: Confidentiality
    testability: automated
    canonical_guidance: |
      Confidentiality of information at rest and in transit must be
      maintained. Findings indicating cleartext or weak cryptography on
      assets carrying confidential data fail this criterion.
    mappings:
      - key: soc2_2017_c1_1_confidentiality_crypto_weakness
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-311", "CWE-319", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved
