# HIPAA Security Rule (45 CFR Part 164, Subpart C) — initial mapping pack.
#
# Scope: Administrative, Physical, and Technical Safeguards that map to
# Hakuna's current detection surface. Most administrative safeguards are
# documentation/process-based and ship as testability=manual_only with
# empty mappings so they appear in the framework view.

framework:
  slug: hipaa_security
  name: HIPAA Security Rule
  version: "2013-Omnibus"
  authority: HHS / OCR
  published_at: 2013-01-25
  description: |
    HIPAA Security Rule — 45 CFR §§ 164.302–164.318. Covers administrative,
    physical, and technical safeguards required to protect electronic
    protected health information (ePHI).
  categories: [Healthcare]
  mapping_schema_version: 1

release:
  tag: "2026.04.25-v1"
  notes: |
    Initial HIPAA Security Rule mapping pack covering selected
    Administrative (§164.308) and Technical (§164.312) safeguards.
    Documentation/process-based requirements are listed as
    manual_only so they appear in the framework view.

controls:

  # ── §164.308: Administrative Safeguards ────────────────────
  - ref: "164.308(a)(1)(ii)(A)"
    title: Risk Analysis
    domain: Risk Analysis
    testability: automated
    canonical_guidance: |
      Conduct an accurate and thorough assessment of the potential risks
      and vulnerabilities to ePHI. Unresolved High+ severity findings
      with a CVE that have breached or are at risk of breaching SLA are
      direct evidence the risk-analysis loop is not closing.
    mappings:
      - key: hipaa_164_308_a_1_ii_a_unresolved_high_critical
        when:
          logic: AND
          conditions:
            - field: finding.has_cve
              op: is_true
            - field: finding.severity
              op: gte
              value: 3
            - field: finding.sla_status
              op: in
              value: [breached, at_risk]
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]

  - ref: "164.308(a)(1)(ii)(B)"
    title: Risk Management
    domain: Risk Management
    testability: automated
    canonical_guidance: |
      Implement security measures sufficient to reduce risks and
      vulnerabilities to a reasonable and appropriate level. Any
      unresolved KEV-listed vulnerability indicates risk management is
      not actually treating known-exploited risk.
    mappings:
      - key: hipaa_164_308_a_1_ii_b_unresolved_kev
        when:
          logic: AND
          conditions:
            - field: finding.is_kev
              op: is_true
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive, accepted_risk]

  - ref: "164.308(a)(5)(ii)(B)"
    title: Protection from Malicious Software
    domain: Endpoint Protection
    testability: partial
    canonical_guidance: |
      Procedures for guarding against, detecting, and reporting malicious
      software. Patch Management family findings at High+ severity on
      in-scope assets indicate the protection cycle is incomplete.
    mappings:
      - key: hipaa_164_308_a_5_ii_b_patch_mgmt_high_critical
        when:
          logic: AND
          conditions:
            - field: finding.plugin_family
              op: eq
              value: "Patch Management"
            - field: finding.severity
              op: gte
              value: 3
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "164.308(a)(6)(ii)"
    title: Response and Reporting (Security Incident Procedures)
    domain: Incident Response
    testability: manual_only
    canonical_guidance: |
      Incident identification, response, mitigation, documentation, and
      outcomes are evidence-based. Mark satisfied via a compensating-
      control note that links to the IR plan and incident records.
    mappings: []

  - ref: "164.308(a)(7)(ii)(A)"
    title: Data Backup Plan
    domain: Contingency Planning
    testability: manual_only
    canonical_guidance: |
      Backup procedures and validation are process-based. Mark satisfied
      via a compensating-control note that links to the most recent
      restore test.
    mappings: []

  # ── §164.312: Technical Safeguards ─────────────────────────
  - ref: "164.312(a)(2)(i)"
    title: Unique User Identification
    domain: Access Control
    testability: automated
    canonical_guidance: |
      Assign a unique name and/or number for identifying and tracking
      user identity. Hardcoded credential findings (CWE-798) and weak
      credential use (CWE-1391) indicate unique-identification controls
      are being undermined.
    mappings:
      - key: hipaa_164_312_a_2_i_hardcoded_or_weak_creds
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-798", "CWE-1391"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "164.312(a)(2)(iv)"
    title: Encryption and Decryption
    domain: Data at Rest
    testability: automated
    canonical_guidance: |
      Implement a mechanism to encrypt and decrypt ePHI. Findings tied
      to missing encryption (CWE-311) or risky/broken cryptographic
      algorithms (CWE-326, CWE-327) fail this addressable specification.
    mappings:
      - key: hipaa_164_312_a_2_iv_weak_or_missing_crypto
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-311", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "164.312(b)"
    title: Audit Controls
    domain: Audit Logging
    testability: manual_only
    canonical_guidance: |
      Audit-control adequacy is evidence-based — covered by SIEM/log
      retention configuration. Mark satisfied via a compensating-control
      note that links to the audit-logging configuration.
    mappings: []

  - ref: "164.312(d)"
    title: Person or Entity Authentication
    domain: Authentication
    testability: automated
    canonical_guidance: |
      Implement procedures to verify that a person or entity seeking
      access to ePHI is the one claimed. Findings tied to weak password
      (CWE-521), insufficiently protected credentials (CWE-522),
      hardcoded creds (CWE-798), or use of weak credentials (CWE-1391)
      indicate the authentication safeguard is failing.
    mappings:
      - key: hipaa_164_312_d_weak_or_default_credentials
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-521", "CWE-522", "CWE-798", "CWE-1391"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "164.312(e)(1)"
    title: Transmission Security
    domain: Data in Transit
    testability: automated
    canonical_guidance: |
      Implement technical security measures to guard against unauthorized
      access to ePHI transmitted over an electronic communications
      network. CWE-319 (cleartext) and CWE-326/327 (broken/risky crypto)
      findings are direct evidence of failing transmission security.
    mappings:
      - key: hipaa_164_312_e_1_transit_crypto_weakness
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-319", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved
