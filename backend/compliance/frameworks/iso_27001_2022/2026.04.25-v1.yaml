# ISO/IEC 27001:2022 — initial mapping pack.
#
# Scope: Annex A controls that map cleanly to Hakuna's current detection
# surface. Organizational, people, and physical controls (A.5 process /
# A.6 / A.7) ship as testability=manual_only with empty mappings so they
# appear in the framework view rather than disappearing silently.

framework:
  slug: iso_27001_2022
  name: ISO/IEC 27001
  version: "2022"
  authority: ISO/IEC
  published_at: 2022-10-25
  description: |
    ISO/IEC 27001:2022 — international standard for information security
    management systems (ISMS). The 2022 revision restructures Annex A
    into 4 themes: organizational, people, physical, technological.
  categories: [ISMS]
  mapping_schema_version: 1

release:
  tag: "2026.04.25-v1"
  notes: |
    Initial ISO 27001:2022 mapping pack covering selected Annex A.5
    organizational and Annex A.8 technological controls. Manual-only
    controls are listed so they surface in the framework view.

controls:

  # ── A.5: Organizational controls ───────────────────────────
  - ref: "A.5.7"
    title: Threat intelligence
    domain: Threat Intelligence
    testability: automated
    canonical_guidance: |
      Threat intelligence must be collected and analysed to produce action.
      Any unresolved KEV-listed finding indicates threat-intel is being
      received but not driving remediation.
    mappings:
      - key: iso_27001_2022_a_5_7_unresolved_kev
        when:
          logic: AND
          conditions:
            - field: finding.is_kev
              op: is_true
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive, accepted_risk]

  - ref: "A.5.24"
    title: Information security incident management planning and preparation
    domain: Incident Response
    testability: manual_only
    canonical_guidance: |
      IR planning is policy/procedure-based. Mark satisfied via a
      compensating-control note that links to the IR plan.
    mappings: []

  - ref: "A.5.26"
    title: Response to information security incidents
    domain: Incident Response
    testability: manual_only
    canonical_guidance: |
      IR execution is evidence-based. Mark satisfied via a compensating-
      control note that links to recent incident records.
    mappings: []

  # ── A.8: Technological controls ────────────────────────────
  - ref: "A.8.8"
    title: Management of technical vulnerabilities
    domain: Vulnerability Management
    testability: automated
    canonical_guidance: |
      Information about technical vulnerabilities must be obtained,
      exposure evaluated, and appropriate measures taken. KEV CVEs past
      SLA, or Patch Management family findings at High+ severity, indicate
      the vulnerability-management process is not effective.
    mappings:
      - key: iso_27001_2022_a_8_8_kev_breached_sla
        when:
          logic: AND
          conditions:
            - field: finding.is_kev
              op: is_true
            - field: finding.sla_status
              op: in
              value: [breached, at_risk]
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]
      - key: iso_27001_2022_a_8_8_patch_mgmt_high_critical
        when:
          logic: AND
          conditions:
            - field: finding.plugin_family
              op: eq
              value: "Patch Management"
            - field: finding.severity
              op: gte
              value: 3
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "A.8.9"
    title: Configuration management
    domain: Configuration Management
    testability: manual_only
    canonical_guidance: |
      Configuration baselines and drift detection are largely process-
      based. Mark satisfied via a compensating-control note that links to
      the baseline document and drift-monitoring evidence.
    mappings: []

  - ref: "A.8.20"
    title: Networks security
    domain: Network Security
    testability: automated
    canonical_guidance: |
      Networks and network devices must be secured, managed, and
      controlled. EASM-discovered exposed services on in-scope assets are
      direct evidence the network controls are insufficient.
    mappings:
      - key: iso_27001_2022_a_8_20_easm_exposed_service
        when:
          logic: AND
          conditions:
            - field: finding.plugin_family
              op: eq
              value: "EASM: Exposed Service"
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]

  - ref: "A.8.24"
    title: Use of cryptography
    domain: Cryptography
    testability: automated
    canonical_guidance: |
      Rules for the effective use of cryptography must be defined and
      enforced. CWE-319 (cleartext), CWE-326/327 (broken or risky crypto),
      and CWE-311 (missing encryption) findings fail this control.
    mappings:
      - key: iso_27001_2022_a_8_24_weak_crypto
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value: ["CWE-311", "CWE-319", "CWE-326", "CWE-327"]
            - field: finding.workflow_status
              op: neq
              value: resolved

  - ref: "A.8.25"
    title: Secure development life cycle
    domain: Secure Development
    testability: manual_only
    canonical_guidance: |
      Lifecycle gates and SSDLC adoption are policy-based. Mark satisfied
      via a compensating-control note that links to the SSDLC document
      and pipeline configuration.
    mappings: []

  - ref: "A.8.28"
    title: Secure coding
    domain: Secure Coding
    testability: automated
    canonical_guidance: |
      Secure coding principles must be applied. Findings mapped to
      injection (CWE-77/78/79/89/90/94), path traversal (CWE-22), or
      insecure deserialization (CWE-502) indicate secure-coding gaps.
    mappings:
      - key: iso_27001_2022_a_8_28_injection_or_traversal
        when:
          logic: AND
          conditions:
            - field: finding.cwe
              op: contains_any
              value:
                - "CWE-22"
                - "CWE-77"
                - "CWE-78"
                - "CWE-79"
                - "CWE-89"
                - "CWE-90"
                - "CWE-94"
                - "CWE-502"
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]

  - ref: "A.8.29"
    title: Security testing in development and acceptance
    domain: Security Testing
    testability: automated
    canonical_guidance: |
      Security testing must be defined and implemented in the development
      lifecycle. Any unresolved High+ severity finding with a CVE on an
      in-scope asset indicates testing did not catch (or did not block
      release of) the issue.
    mappings:
      - key: iso_27001_2022_a_8_29_unresolved_high_critical
        when:
          logic: AND
          conditions:
            - field: finding.has_cve
              op: is_true
            - field: finding.severity
              op: gte
              value: 3
            - field: finding.workflow_status
              op: not_in
              value: [resolved, false_positive]
