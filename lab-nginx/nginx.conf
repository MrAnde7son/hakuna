# Smuggling-friendly nginx front for lab-webapp.
#
# Detection target — not a guaranteed working exploit. Real-world smuggling
# success depends on the exact origin parser. The audit should flag:
#   - proxy upstream over HTTP/1.0 with Connection: keep-alive (mismatch)
#   - chunked_transfer_encoding on (default) but origin parses CL first
#   - Host header forwarded as X-Forwarded-Host without sanitisation
#     → enables the cache-poisoning chain against /reset on lab-webapp.
#
# Keep this minimal — clarity for audits beats production hardening.

worker_processes 1;
events { worker_connections 256; }

http {
    upstream lab_origin {
        server webapp:5000;
        keepalive 32;
    }

    proxy_http_version 1.0;          # ← intentional: HTTP/1.0 + keepalive
    proxy_set_header Connection "keep-alive";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Cache shared across clients — primes /reset poisoning when paired with
    # the X-Forwarded-Host trust on the origin.
    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=lab_cache:8m max_size=64m;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://lab_origin;
            proxy_cache lab_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_methods GET HEAD POST;
        }
    }
}
