<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-symbol.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hakuna Exposure Management Platform</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        /* Light theme tokens */
        --bg: #ffffff;
        --bg-muted: #fafafa;
        --card: #ffffff;
        --popover: #ffffff;
        --border: #e5e7eb;
        --input: #e5e7eb;
        --ring: rgba(59, 130, 246, 0.35);
        --text: #0f172a;
        --muted: #64748b;
        --muted-2: #94a3b8;
        --primary: #2563eb;
        --primary-foreground: #ffffff;
        --secondary: #f1f5f9;
        --secondary-foreground: #0f172a;
        --danger: #ef4444;
        --warning: #f59e0b;
        --success: #22c55e;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 10px 30px rgba(0, 0, 0, 0.06);
        --r: 12px;
        --sans: ui-sans-serif, system-ui, -apple-system, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

        /* Backwards-compatible aliases */
        --critical: #dc2626;
        --high: #ea580c;
        --medium: #d97706;
        --low: #65a30d;
        --info: #0ea5e9;
        --violet: #7c3aed;
        --bg-primary: var(--bg);
        --bg-secondary: var(--bg);
        --bg-card: var(--card);
        --bg-hover: #f1f5f9;
        --text-primary: var(--text);
        --text-secondary: var(--muted);
        --text-muted: var(--muted-2);
        --accent: var(--primary);
        --accent-hover: #1d4ed8;

        /* Component-specific tokens */
        --nav-active-bg: #18181b;
        --nav-active-text: #ffffff;
        --avatar-bg: #18181b;
        --avatar-text: #ffffff;
        --surface: #ffffff;
        --danger-subtle: #fef2f2;
        --success-subtle: #f0fdf4;
        --warning-subtle: #fffbeb;

        /* Severity badge tokens (light) */
        --sev-critical-bg: #fef2f2; --sev-critical-text: #991b1b; --sev-critical-border: #fca5a5;
        --sev-high-bg: #fff7ed; --sev-high-text: #9a3412; --sev-high-border: #fdba74;
        --sev-medium-bg: #fffbeb; --sev-medium-text: #92400e; --sev-medium-border: #fcd34d;
        --sev-low-bg: #f0fdf4; --sev-low-text: #166534; --sev-low-border: #86efac;
        --sev-info-bg: #f0f9ff; --sev-info-text: #0369a1; --sev-info-border: #7dd3fc;
      }

      [data-theme="dark"] {
        --bg: #0d1117;
        --bg-muted: #090c10;
        --card: #161b22;
        --popover: #1c2128;
        --border: #30363d;
        --input: #30363d;
        --ring: rgba(88, 166, 255, 0.35);
        --text: #e6edf3;
        --muted: #8b949e;
        --muted-2: #6e7681;
        --primary: #58a6ff;
        --primary-foreground: #0d1117;
        --secondary: #21262d;
        --secondary-foreground: #c9d1d9;
        --danger: #f85149;
        --warning: #e3b341;
        --success: #3fb950;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.3);

        --critical: #f85149;
        --high: #fb923c;
        --medium: #e3b341;
        --low: #7ee787;
        --info: #58a6ff;
        --violet: #a78bfa;
        --bg-primary: var(--bg);
        --bg-secondary: var(--bg);
        --bg-card: var(--card);
        --bg-hover: #1c2128;
        --text-primary: var(--text);
        --text-secondary: var(--muted);
        --text-muted: var(--muted-2);
        --accent: var(--primary);
        --accent-hover: #79b8ff;

        --nav-active-bg: #e6edf3;
        --nav-active-text: #0d1117;
        --avatar-bg: #21262d;
        --avatar-text: #e6edf3;
        --surface: #161b22;
        --danger-subtle: #2d1515;
        --success-subtle: #0a1e0f;
        --warning-subtle: #1a1200;

        /* Severity badge tokens (dark) */
        --sev-critical-bg: #450a0a; --sev-critical-text: #fca5a5; --sev-critical-border: #991b1b;
        --sev-high-bg: #431407; --sev-high-text: #fdba74; --sev-high-border: #9a3412;
        --sev-medium-bg: #451a03; --sev-medium-text: #fcd34d; --sev-medium-border: #92400e;
        --sev-low-bg: #1a2e05; --sev-low-text: #86efac; --sev-low-border: #166534;
        --sev-info-bg: #0c1a2e; --sev-info-text: #7dd3fc; --sev-info-border: #0369a1;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
      }

      /* Global focus-visible indicator for keyboard accessibility */
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
