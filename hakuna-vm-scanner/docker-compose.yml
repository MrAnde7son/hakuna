# Local dev: VM scanner shares the main hakuna stack's Postgres and Redis.
# Mirrors production, where VM scanner connects to the same Cloud SQL database
# (`hakuna`, user `hakuna`) as the main API — see terraform/compute_scanners.tf.
# The only prod↔local divergence is Redis: prod gives VM scanner a dedicated
# Memorystore (VM_REDIS_HOST); locally we multiplex on the hakuna redis using
# DB 0 (VM scanner broker/result) vs DB 2 (audits), matching the reservation
# documented in ../docker-compose.yml.
#
# Bring up order:
#   1. cd .. && docker compose up -d       # starts postgres + redis + backend
#   2. cd hakuna-vm-scanner && docker compose up -d
#
# Override DATABASE_URL / CELERY_BROKER_URL in .env to point at a different
# DB/broker (prod smoke-test, isolated scratch DB, etc.).
services:
  vm-api:
    build: .
    command: >
      uvicorn scanner.vm.api:create_app --factory --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    networks:
      - hakuna_default
      - hakuna-lab

  vm-worker:
    build: .
    tty: true
    command: >
      celery -A scanner.vm.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      -Q vm_queue
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
      # Vertex AI — passthrough from the host shell so a developer who ran
      # `gcloud auth application-default login` locally gets the same LLM
      # provider (vertex_ai) the Cloud Run backend resolves to. The scanner's
      # llm_provider module respects integration_configs first; these are
      # only a fallback when nothing is stored in the DB.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      # Legacy / optional provider keys — same order as backend agent_engine
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
      # ADC mount — google-genai SDK looks up
      # application_default_credentials.json here. Safe read-only bind of
      # the host's ~/.config/gcloud; the ADC file is per-developer and
      # never baked into the image.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    networks:
      - hakuna_default
      - hakuna-lab

  vm-beat:
    build: .
    command: >
      celery -A scanner.vm.celery_app:celery_app beat
      --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    networks:
      - hakuna_default

# Shared networks:
#   hakuna_default — created by ../docker-compose.yml; hosts postgres + redis.
#   hakuna-lab     — created by ../docker-compose.lab.yml; hosts dvwa/smb/ldap
#                    targets the worker scans. Bring it up first if you need
#                    the lab; otherwise vm-worker still runs (it only resolves
#                    lab hostnames when a scan targets them).
networks:
  hakuna_default:
    external: true
  hakuna-lab:
    external: true
