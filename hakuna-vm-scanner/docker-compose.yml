services:
  vm-api:
    build: .
    command: >
      uvicorn scanner.vm.api:create_app --factory --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    networks:
      - hakuna
    depends_on:
      - vm-worker

  vm-worker:
    build: .
    tty: true
    command: >
      celery -A scanner.vm.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      -Q vm_queue
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    networks:
      - hakuna

  vm-beat:
    build: .
    command: >
      celery -A scanner.vm.celery_app:celery_app beat
      --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    networks:
      - hakuna

networks:
  hakuna:
    external: true
