services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hakuna
      POSTGRES_PASSWORD: hakuna
      POSTGRES_DB: hakuna
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakuna"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # AOF persistence with fsync every second — survives container restart so
    # queued Celery tasks and result-backend entries aren't lost. Without this,
    # a restart silently orphans any in-flight scan (job_ids point to tasks
    # that no longer exist in the broker).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vm-api:
    build: .
    command: >
      uvicorn scanner.vm.api:create_app --factory --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vm-worker:
    build: .
    tty: true
    command: >
      celery -A scanner.vm.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      -Q vm_queue
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
      # Vertex AI — passthrough from the host shell so a developer who ran
      # `gcloud auth application-default login` locally gets the same LLM
      # provider (vertex_ai) the Cloud Run backend resolves to. The scanner's
      # llm_provider module respects integration_configs first; these are
      # only a fallback when nothing is stored in the DB.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      # Legacy / optional provider keys — same order as backend agent_engine
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
      # ADC mount — google-genai SDK looks up
      # application_default_credentials.json here. Safe read-only bind of
      # the host's ~/.config/gcloud; the ADC file is per-developer and
      # never baked into the image.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vm-beat:
    build: .
    command: >
      celery -A scanner.vm.celery_app:celery_app beat
      --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hakuna:hakuna@postgres:5432/hakuna}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONPATH: /app
      TEMPLATES_DIR: /app/templates
    volumes:
      - ./scanner:/app/scanner
      - ./templates:/app/templates
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
