services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./intel.json:/app/intel.json:ro
    environment:
      - DATABASE_URL=sqlite:////app/data/nessus_remediation.db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
