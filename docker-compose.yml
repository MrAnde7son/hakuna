services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./intel.json:/app/intel.json:ro
      - ./hakuna:/app/hakuna:ro
    environment:
      - DATABASE_URL=sqlite:////app/data/nessus_remediation.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # Used by the scheduled-report PDF renderer — headless Chromium inside
      # the backend container reaches the sibling `frontend` service by its
      # Compose network hostname. Override via env for custom setups.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://frontend:3000}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${SIEM_LAKE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${SIEM_LAKE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  vector-dev:
    image: timberio/vector:0.49.0-alpine
    ports:
      - "6514:6514"   # syslog TCP
      - "9514:9514/udp" # syslog UDP
      - "8088:8088"   # HEC / HTTP
    volumes:
      - ./deploy/vector:/etc/vector:ro
    depends_on:
      - backend
    command: ["--config", "/etc/vector/vector.dev.yaml"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/hakuna-events-dev &&
      echo 'Bucket hakuna-events-dev ready'
      "

volumes:
  db-data:
  minio-data:
