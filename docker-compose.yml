services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./intel.json:/app/intel.json:ro
      - ./hakuna:/app/hakuna:ro
    environment:
      - DATABASE_URL=sqlite:////app/data/nessus_remediation.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

volumes:
  db-data:
