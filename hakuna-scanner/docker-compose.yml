# Local dev: EASM scanner shares the main hakuna stack's Postgres and Redis,
# matching the VM scanner's pattern. EASM models collide with the main backend
# on table names (`findings`, `orgs`, `assets`), so EASM gets its own database
# `hakuna_easm` on the same Postgres instance — created by
# scripts/postgres-init/01-create-easm-db.sh on first volume init. Redis is
# multiplexed by DB number; EASM uses DB 3 (see ../docker-compose.yml).
#
# Production is unaffected — Cloud Run doesn't use this compose file.
#
# Bring up order:
#   1. cd .. && docker compose up -d              # postgres + redis + backend
#   2. cd hakuna-scanner && docker compose up -d  # easm-api + workers
#
# If your `postgres-data` volume predates this change, the init script will
# not have run. Create the DB manually:
#   docker compose -f ../docker-compose.yml exec postgres \
#     createdb -U hakuna hakuna_easm
services:
  easm-api:
    build: .
    command: >
      sh -c "PYTHONPATH=/app alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hakuna:hakuna@postgres:5432/hakuna_easm
      DATABASE_URL_SYNC: postgresql://hakuna:hakuna@postgres:5432/hakuna_easm
      REDIS_URL: redis://redis:6379/3
      PYTHONPATH: /app
    volumes:
      - .:/app
      - screenshots:/data/screenshots
    networks:
      - hakuna_default

  worker:
    build: .
    tty: true
    # --concurrency=4 so up to 4 scan chains run in parallel. Pair with a
    # 4-core CPU budget below so each worker process gets ~1 core. Bumped
    # from 2 after observing queued scans stacking up in the UI — every
    # extra running scan cuts the queue wait for subsequent ones.
    command: >
      celery -A app.celery_app:celery worker
      --loglevel=info
      --concurrency=4
      -Q celery
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hakuna:hakuna@postgres:5432/hakuna_easm
      DATABASE_URL_SYNC: postgresql://hakuna:hakuna@postgres:5432/hakuna_easm
      REDIS_URL: redis://redis:6379/3
      PYTHONPATH: /app
    volumes:
      - .:/app
      - screenshots:/data/screenshots
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    networks:
      - hakuna_default

  nmap-worker:
    build: .
    tty: true
    command: >
      celery -A app.celery_app:celery worker
      --loglevel=info
      --concurrency=3
      -Q nmap_queue
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hakuna:hakuna@postgres:5432/hakuna_easm
      DATABASE_URL_SYNC: postgresql://hakuna:hakuna@postgres:5432/hakuna_easm
      REDIS_URL: redis://redis:6379/3
      PYTHONPATH: /app
    volumes:
      - .:/app
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    networks:
      - hakuna_default

  beat:
    build: .
    command: >
      celery -A app.celery_app:celery beat
      --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hakuna:hakuna@postgres:5432/hakuna_easm
      DATABASE_URL_SYNC: postgresql://hakuna:hakuna@postgres:5432/hakuna_easm
      REDIS_URL: redis://redis:6379/3
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - hakuna_default

volumes:
  screenshots:

networks:
  hakuna_default:
    external: true
